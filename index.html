<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Accessibility -->
    <meta name="description" content="An interactive space mission simulator featuring real NASA data and physics calculations. Experience realistic orbital mechanics and space exploration." />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Space Mission Simulator" />
    <meta property="og:description" content="An interactive space mission simulator featuring real NASA data and physics calculations." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="Space Mission Simulator" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space Mission Simulator" />
    <meta name="twitter:description" content="Interactive space mission simulator with real NASA data" />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Security & Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect to improve font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <title>Space Mission Simulator - Interactive NASA Data Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
