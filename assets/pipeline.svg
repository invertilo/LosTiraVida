<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="pt pd">
  <title id="pt">Pipeline de LosTiraVida</title>
  <desc id="pd">Flujo animado desde los datos abiertos hasta la app y el payload de privacidad</desc>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16315C"/>
      <stop offset="1" stop-color="#0F2445"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M 60 105 L 1140 105"/>
  </defs>
  <rect width="1200" height="210" rx="20" fill="#0B1A33"/>

  <!-- Conectores -->
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#1E3A66" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Puntos viajando por el flujo, desfasados -->
  <g fill="#4DA3FF" filter="url(#glow)">
    <circle r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M 60 105 L 1140 105"/></circle>
    <circle r="5" opacity="0.8"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M 60 105 L 1140 105"/></circle>
    <circle r="5" opacity="0.6"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M 60 105 L 1140 105"/></circle>
  </g>

  <!-- Nodos -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="20" y="70" width="170" height="70" rx="14" fill="url(#node)" stroke="#2B5C9E" stroke-width="1.5"/>
      <text x="105" y="100" font-size="16" font-weight="600" fill="#FFFFFF">MIT-BIH · NSTDB</text>
      <text x="105" y="122" font-size="13" fill="#8FB8E8">ECG y ruido reales</text>
    </g>
    <g>
      <rect x="225" y="70" width="170" height="70" rx="14" fill="url(#node)" stroke="#2B5C9E" stroke-width="1.5"/>
      <text x="310" y="100" font-size="16" font-weight="600" fill="#FFFFFF">Pan-Tompkins</text>
      <text x="310" y="122" font-size="13" fill="#8FB8E8">latidos y HRV</text>
    </g>
    <g>
      <rect x="430" y="70" width="170" height="70" rx="14" fill="url(#node)" stroke="#2B5C9E" stroke-width="1.5"/>
      <text x="515" y="100" font-size="16" font-weight="600" fill="#FFFFFF">Validación</text>
      <text x="515" y="122" font-size="13" fill="#8FB8E8">F1 contra cardiólogos</text>
    </g>
    <g>
      <rect x="635" y="70" width="170" height="70" rx="14" fill="url(#node)" stroke="#2B5C9E" stroke-width="1.5"/>
      <text x="720" y="100" font-size="16" font-weight="600" fill="#FFFFFF">PAMAP2 · LOSO</text>
      <text x="720" y="122" font-size="13" fill="#8FB8E8">clasificación de actividad</text>
    </g>
    <g>
      <rect x="840" y="70" width="170" height="70" rx="14" fill="url(#node)" stroke="#2B5C9E" stroke-width="1.5"/>
      <text x="925" y="100" font-size="16" font-weight="600" fill="#FFFFFF">Privacidad</text>
      <text x="925" y="122" font-size="13" fill="#8FB8E8">solo métricas agregadas</text>
    </g>
    <g>
      <rect x="1030" y="70" width="110" height="70" rx="14" fill="#4DA3FF"/>
      <text x="1085" y="100" font-size="16" font-weight="700" fill="#0B1A33">App</text>
      <text x="1085" y="122" font-size="13" fill="#0B1A33">Streamlit</text>
    </g>
  </g>
</svg>
