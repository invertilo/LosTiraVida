<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#4DA3FF" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#4DA3FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Línea base tenue -->
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#1E3A66" stroke-width="1"/>
  <!-- Trazo de ECG que se dibuja y se repite -->
  <path d="M 0 32 L 300 32 L 318 32 L 326 14 L 336 50 L 350 4 L 364 40 L 380 32 L 600 32 L 618 32 L 626 14 L 636 50 L 650 4 L 664 40 L 680 32 L 900 32 L 918 32 L 926 14 L 936 50 L 950 4 L 964 40 L 980 32 L 1200 32"
        fill="none" stroke="url(#fade)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0;-1000" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- Punto que viaja con el trazo -->
  <circle r="4" fill="#FFFFFF">
    <animateMotion dur="5s" repeatCount="indefinite" keyTimes="0;1" keyPoints="0;1" calcMode="linear" path="M 0 32 L 1200 32"/>
  </circle>
</svg>
