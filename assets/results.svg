<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="rt rd">
  <title id="rt">Resultados de validación</title>
  <desc id="rd">Barras animadas con F1 en MIT-BIH y con ruido real de NSTDB</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#1F6FD1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#0B1A33"/>
  <text x="60" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">F1 contra anotaciones de cardiólogos</text>
  <text x="60" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8FB8E8">Barras de 0 a 1. Ver tabla completa en la sección Validation de la app.</text>

  <!-- Línea base y escala -->
  <line x1="60" y1="270" x2="1140" y2="270" stroke="#1E3A66" stroke-width="1"/>
  <line x1="60" y1="150" x2="1140" y2="150" stroke="#1E3A66" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Barra 1: registro 100, F1 1.000 (altura máxima 200 px) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
    <rect x="130" y="70" width="110" height="200" rx="8" fill="url(#bar)">
      <animate attributeName="y" from="270" to="70" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="height" from="0" to="200" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
    <text x="185" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0">1.000<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/></text>
    <text x="185" y="298" text-anchor="middle" font-size="15" fill="#B9D7F5">Registro 100</text>

    <!-- Barra 2: promedio 48 registros, F1 0.993 (193 px) -->
    <rect x="360" y="71" width="110" height="199" rx="8" fill="url(#bar)">
      <animate attributeName="y" from="270" to="71" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="height" from="0" to="199" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
    <text x="415" y="61" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0">0.993<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/></text>
    <text x="415" y="298" text-anchor="middle" font-size="15" fill="#B9D7F5">Promedio, 48 registros</text>

    <!-- Barra 3: peor registro 108, F1 0.865 (173 px) -->
    <rect x="590" y="97" width="110" height="173" rx="8" fill="#2B5C9E">
      <animate attributeName="y" from="270" to="97" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="height" from="0" to="173" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
    <text x="645" y="87" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0">0.865<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/></text>
    <text x="645" y="298" text-anchor="middle" font-size="15" fill="#B9D7F5">Peor registro (108)</text>

    <!-- Barra 4: ruido −6 dB sin abstención, F1 0.79 (142 px) -->
    <rect x="820" y="112" width="110" height="158" rx="8" fill="#1B3F6E">
      <animate attributeName="y" from="270" to="112" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="height" from="0" to="158" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
    <text x="875" y="102" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0">0.79<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/></text>
    <text x="875" y="298" text-anchor="middle" font-size="15" fill="#B9D7F5">Ruido −6 dB, sin abstención</text>

    <!-- Barra 5: ruido −6 dB con abstención, F1 0.84 (151 px) -->
    <rect x="1050" y="102" width="110" height="168" rx="8" fill="url(#bar)">
      <animate attributeName="y" from="270" to="102" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="height" from="0" to="168" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
    <text x="1105" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0">0.84<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/></text>
    <text x="1105" y="298" text-anchor="middle" font-size="15" fill="#B9D7F5">Ruido −6 dB, con abstención</text>
  </g>
</svg>
